server:
  port: 8080

spring:
  config:
    import: optional:classpath:application-local.yml

data-generator:
  writable-config-dir: ./data/configs
  auth:
    enabled: true
    username: admin
    password: admin123
  task-run:
    sync-threshold: 5000
    batch-size: 1000
    thread-pool-size: 4
    generation-parallelism: 0
  storage:
    sqlite-path: ./data/dg-tasks.db
    log-dir: ./data/task-run-logs
  ai:
    enabled: true
    remote-base-url: http://localhost:8081
    request-timeout: 120s
  service-auth:
    token: ${DG_SERVICE_AUTH_TOKEN:ai-tokens}
