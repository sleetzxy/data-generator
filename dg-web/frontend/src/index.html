<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Generator 控制台</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-shell">
<aside class="app-sidebar">
    <div class="sidebar-brand">
        <div class="sidebar-brand-icon" aria-hidden="true">DG</div>
        <div>
            <h1 class="sidebar-title">Data Generator</h1>
            <p class="sidebar-subtitle">测试数据生成</p>
        </div>
    </div>
    <nav class="sidebar-nav" aria-label="主导航">
        <div class="sidebar-group">
            <div class="sidebar-group-title">概览</div>
            <a href="#overview" class="sidebar-link" data-view="overview">
                <svg class="sidebar-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                    <rect x="14" y="14" width="7" height="7" rx="1"/>
                </svg>
                <span>运行概览</span>
            </a>
        </div>
        <div class="sidebar-group">
            <div class="sidebar-group-title">任务</div>
            <a href="#tasks" class="sidebar-link" data-view="tasks">
                <svg class="sidebar-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
                    <rect x="9" y="3" width="6" height="4" rx="1"/>
                    <line x1="9" y1="12" x2="15" y2="12"/>
                    <line x1="9" y1="16" x2="13" y2="16"/>
                </svg>
                <span>任务管理</span>
            </a>
        </div>
        <div class="sidebar-group">
            <div class="sidebar-group-title">帮助</div>
            <a href="#docs" class="sidebar-link" data-view="docs">
                <svg class="sidebar-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                </svg>
                <span>配置指南</span>
            </a>
        </div>
        <div class="sidebar-group sidebar-group-ai" id="sidebar-group-ai">
            <div class="sidebar-group-title">智能</div>
            <a href="#ai" class="sidebar-link" id="nav-ai" data-view="ai">
                <svg class="sidebar-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M12 8V4H8"/>
                    <rect x="4" y="8" width="16" height="12" rx="2"/>
                    <path d="M2 14h2M20 14h2M12 14v4"/>
                    <circle cx="9" cy="13" r="1" fill="currentColor" stroke="none"/>
                    <circle cx="15" cy="13" r="1" fill="currentColor" stroke="none"/>
                </svg>
                <span>AI 助手</span>
            </a>
        </div>
    </nav>
    <div class="sidebar-footer">
        <div class="sidebar-group sidebar-group-footer">
            <div class="sidebar-group-title">账户</div>
            <form class="logout-form" action="/api/v1/auth/logout" method="post">
                <button type="submit" class="sidebar-logout">
                    <svg class="sidebar-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    <span>退出登录</span>
                </button>
            </form>
        </div>
    </div>
</aside>

<div class="app-main">
    <header class="app-topbar">
        <h2 id="view-title" class="app-topbar-title">任务管理</h2>
    </header>

    <main class="app-content">
        <!-- 运行概览 -->
        <section id="view-overview" class="app-view hidden">
            <div id="overview-stats" class="overview-stats"></div>
            <div class="overview-grid">
                <section class="panel overview-panel">
                    <div class="panel-header">
                        <h3>进行中的任务</h3>
                        <span id="overview-active-count" class="panel-meta">0 个</span>
                    </div>
                    <div class="table-wrap overview-table-wrap scrollbar-overlay">
                        <table>
                            <thead>
                            <tr>
                                <th>任务 ID</th>
                                <th>配置</th>
                                <th>状态</th>
                                <th>进度</th>
                                <th>提交时间</th>
                            </tr>
                            </thead>
                            <tbody id="overview-active-body"></tbody>
                        </table>
                    </div>
                </section>
                <section class="panel overview-panel">
                    <div class="panel-header">
                        <h3>最近运行</h3>
                        <span id="overview-recent-meta" class="panel-meta">最近 15 条</span>
                    </div>
                    <div class="table-wrap overview-table-wrap scrollbar-overlay">
                        <table>
                            <thead>
                            <tr>
                                <th>任务 ID</th>
                                <th>配置</th>
                                <th>状态</th>
                                <th>耗时</th>
                                <th>提交时间</th>
                            </tr>
                            </thead>
                            <tbody id="overview-recent-body"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </section>

        <!-- 任务管理 -->
        <section id="view-tasks" class="app-view">
            <section class="panel panel-fill">
                <div class="toolbar">
                    <button id="btn-new-definition" class="btn primary">新建任务</button>
                    <button id="btn-refresh-definitions" class="btn">刷新</button>
                    <input type="search" id="definition-search" class="search-input" placeholder="搜索任务名称…" autocomplete="off">
                </div>
                <div class="table-wrap definitions-table-wrap scrollbar-overlay">
                    <table class="definitions-table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>名称</th>
                            <th>类型</th>
                            <th>Cron</th>
                            <th>最近状态</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody id="definitions-body"></tbody>
                    </table>
                </div>
                <div id="definitions-pagination" class="pagination hidden"></div>
            </section>
        </section>

        <!-- AI 助手 -->
        <section id="view-ai" class="app-view hidden">
            <div class="ai-panel panel panel-fill">
                <header class="ai-panel-header">
                    <p class="ai-panel-desc">基于 ReAct 的配置顾问，可创建、编辑与校验 YAML 任务配置</p>
                    <div class="ai-panel-actions">
                        <button id="ai-new-chat" type="button" class="ai-header-icon-btn" title="新对话">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 5v14M5 12h14"/>
                            </svg>
                        </button>
                        <button id="ai-history-btn" type="button" class="ai-header-icon-btn" title="历史对话">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <polyline points="12 6 12 12 16 14"/>
                            </svg>
                        </button>
                        <button id="ai-clear-chat" type="button" class="ai-header-icon-btn" title="清空会话">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"/>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                            </svg>
                        </button>
                    </div>
                </header>
                <div id="ai-history-panel" class="ai-history-panel hidden">
                    <div class="ai-history-list" id="ai-history-list"></div>
                </div>
                <div class="ai-panel-body">
                    <div id="ai-messages" class="ai-messages scrollbar-overlay"></div>
                    <div class="ai-composer">
                        <form id="ai-chat-form" class="ai-composer-form">
                            <textarea id="ai-input" rows="1" spellcheck="false"
                                      placeholder="描述你的造数需求，例如：帮我创建一个包含用户和订单表的任务配置…"></textarea>
                            <div class="ai-composer-toolbar">
                                <div class="ai-composer-right">
                                    <button type="submit" id="ai-send-btn" class="ai-send-btn" aria-label="发送" disabled>
                                        <svg class="ai-send-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                                            <path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                                  stroke-linejoin="round" d="M12 19V5M12 5l-5 5M12 5l5 5"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <!-- 配置指南 -->
        <section id="view-docs" class="app-view hidden">
            <div class="docs-content-shell">
                <aside class="docs-sidebar scrollbar-overlay" id="docs-sidebar">
                    <div class="docs-sidebar-title">目录</div>
                    <nav id="docs-toc" class="docs-toc"></nav>
                </aside>
                <article class="docs-content scrollbar-overlay">
                    <div id="docs-body" class="docs-body">
                        <p class="docs-loading">加载中…</p>
                    </div>
                </article>
            </div>
        </section>
    </main>
</div>

<div id="modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content modal-editor">
        <div class="modal-header">
            <h2 id="modal-title">编辑任务</h2>
            <div class="modal-header-actions">
                <button id="guide-toggle" type="button" class="btn small" aria-expanded="true">配置指南</button>
                <button id="modal-close" class="icon-btn" aria-label="关闭">&times;</button>
            </div>
        </div>
        <div class="modal-body modal-editor-body">
            <label id="name-field" class="field">
                <span>任务名称</span>
                <input type="text" id="definition-name" placeholder="例如 我的测试任务">
            </label>
            <div class="editor-split">
                <div class="editor-pane">
                    <div class="editor-pane-label">YAML 内容</div>
                    <div id="definition-editor" class="yaml-editor-host"></div>
                    <textarea id="definition-content" class="hidden-fallback" spellcheck="false" aria-hidden="true"></textarea>
                </div>
                <aside id="guide-panel" class="guide-panel scrollbar-overlay">
                    <div class="guide-panel-header">
                        <span>配置指南</span>
                        <a href="#docs" class="guide-open-link">完整配置指南</a>
                    </div>
                    <nav id="guide-toc" class="guide-toc"></nav>
                    <div id="guide-body" class="guide-body scrollbar-overlay">
                        <p class="docs-loading">加载中…</p>
                    </div>
                </aside>
            </div>
            <div id="schedule-fields" class="schedule-fields">
                <h3 class="section-title">定时调度</h3>
                <label class="field">
                    <span>启用定时调度</span>
                    <div class="field-control field-control-checkbox">
                        <input type="checkbox" id="definition-schedule-enabled">
                        <span class="checkbox-caption">开启后按 Cron 自动执行</span>
                    </div>
                </label>
                <label class="field">
                    <span>Cron 表达式</span>
                    <input type="text" id="definition-schedule-cron" placeholder="0 0 2 * * ?" spellcheck="false">
                    <small class="field-hint">Spring 6 字段格式：秒 分 时 日 月 周</small>
                </label>
                <label class="field" id="definition-next-run-field">
                    <span>下次执行</span>
                    <div id="definition-schedule-next-run" class="field-readonly">—</div>
                </label>
            </div>
        </div>
        <div class="modal-footer">
            <button id="modal-cancel" class="btn">取消</button>
            <button id="modal-save" class="btn primary">保存</button>
        </div>
    </div>
</div>

<div id="preview-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content modal-xwide">
        <div class="modal-header">
            <h2 id="preview-title">数据预览</h2>
            <button id="preview-close" class="icon-btn" aria-label="关闭">&times;</button>
        </div>
        <div class="modal-body preview-modal-body scrollbar-overlay">
            <div id="preview-content" class="preview-content"></div>
            <div id="preview-pagination" class="pagination hidden"></div>
        </div>
    </div>
</div>

<div id="log-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content modal-wide">
        <div class="modal-header">
            <h2 id="log-title">运行记录</h2>
            <button id="log-close" class="icon-btn" aria-label="关闭">&times;</button>
        </div>
        <div class="modal-body scrollbar-overlay">
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>任务 ID</th>
                        <th>状态</th>
                        <th>提交时间</th>
                        <th>耗时</th>
                        <th>写入行数</th>
                    </tr>
                    </thead>
                    <tbody id="log-runs-body"></tbody>
                </table>
            </div>
            <div id="log-pagination" class="pagination hidden"></div>
        </div>
    </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/js/lib/csrf.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
