id: task_level_connections
name: 任务配置级 connections 测试
connections:
  my-pg:
    type: postgresql
    url: jdbc:postgresql://task-host:5432/taskdb
    username: taskuser
    password: taskpass
writer:
  type: postgresql
  connection: my-pg
  mode: insert
seeds:
  - name: sample
    reader:
      type: postgresql
      connection: my-pg
      query: SELECT 1
tables:
  - name: items
    count: 1
    schema:
      table: items
      fields:
        - name: id
          type: BIGINT
          generator: { strategy: sequence, start: 1, step: 1 }
